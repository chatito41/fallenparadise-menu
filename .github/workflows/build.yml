name: Compilar mod
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
      - name: Instalar Gradle 4.9
        run: |
          wget -q -P "$HOME" https://services.gradle.org/distributions/gradle-4.9-bin.zip
          unzip -q "$HOME/gradle-4.9-bin.zip" -d "$HOME"
          echo "$HOME/gradle-4.9/bin" >> "$GITHUB_PATH"
      - name: Descomprimir el proyecto
        run: |
          mkdir proj
          unzip -q "$(ls *.zip | head -1)" -d proj
      - name: Compilar
        run: |
          cd "$(dirname "$(find proj -name build.gradle | head -1)")"
          gradle setupCIWorkspace build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: fallenparadise-menu
          path: proj/**/build/libs/*.jar
